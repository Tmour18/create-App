<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finanzen</title>
  <meta name="description" content="Persönlicher Monats-Taschenrechner für die Finanzen – offline, ohne Bankanbindung.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Finanzen">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="view" id="view-month"></section>
    <section class="view" id="view-months" hidden></section>
    <section class="view" id="view-stats" hidden></section>
    <section class="view" id="view-data" hidden></section>
  </main>

  <!-- Zusammenfassung: immer sichtbar auf der Monatsseite -->
  <div id="summary" hidden aria-live="polite">
    <div class="sum-grid">
      <div><small>Verfügbar</small><b data-out="available"></b></div>
      <div><small>Ausgaben</small><b class="red" data-out="expenses"></b></div>
      <div><small>Vorsorge</small><b class="blue" data-out="potDeposits"></b></div>
      <div><small>Rücklagen</small><b class="gold-soft" data-out="goalDeposits"></b></div>
    </div>
    <div class="sum-main"><span>Übertrag</span><b data-out="carryOut"></b></div>
  </div>

  <nav class="tabbar" aria-label="Navigation">
    <button data-tab="month"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7h7M8.5 11h.01M12 11h.01M15.5 11h.01M8.5 14.5h.01M12 14.5h.01M15.5 14.5h.01M8.5 18h.01M12 18h.01M15.5 18h.01"/></svg><span>Monat</span></button>
    <button data-tab="months"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Monate</span></button>
    <button data-tab="stats"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Übersicht</span></button>
    <button data-tab="data"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 10.5 12 15l4.5-4.5"/><path d="M4 15v3a2.5 2.5 0 0 0 2.5 2.5h11A2.5 2.5 0 0 0 20 18v-3"/></svg><span>Daten</span></button>
  </nav>

  <!-- Rechenleiste über der Zahlentastatur -->
  <div id="opbar" hidden>
    <div class="op-info"><span id="op-preview"></span><span class="op-carry">Übertrag <b data-out="carryOut"></b></span></div>
    <div class="op-keys">
      <button data-op="+" aria-label="plus">+</button>
      <button data-op="-" aria-label="minus">−</button>
      <button data-op="*" aria-label="mal">×</button>
      <button data-op="/" aria-label="geteilt">÷</button>
      <button data-op="(">(</button>
      <button data-op=")">)</button>
      <button data-op="=" aria-label="ausrechnen">=</button>
      <button data-op="done" class="done">Fertig</button>
    </div>
  </div>

  <div id="modal" hidden></div>
  <div id="toast" role="status"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
